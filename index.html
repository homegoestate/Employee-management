  function previewNode(r){const {el,add,table,note,card}=H();const box=el('div');box.append(table(['薪資項目','金額'],[['本薪',money(r.baseSalary)],['全勤獎金（依法調整後）',money(r.attendanceBonus)],['加班費',money(r.overtimeCash)],['特休／補休結清',money(r.settlementCash)],['其他加給',money(r.bonuses)],['請假扣款',money(r.leaveDeduction)],['保險、稅額及其他扣項',money(r.manualDeductions)],...(r.gross!==undefined?[['應發總額',money(r.gross)]]:[]),['實發金額（待發放）',money(r.net)]]));if(r.requiresReview?.length)box.append(note('尚待覆核：'+r.requiresReview.join('；'),true));box.append(note((r.paymentStatus||'待發放（系統未匯款）')+'。'+(r.rounding||'')));if(r.leaveDetail?.length)box.append(table(['假單','假別','分鐘','扣款參考'],r.leaveDetail.map(x=>[x.requestId,x.type,x.minutes,money(x.amount)])));return box;}
  function finance(root){const {heading,card,field,select,form,action,add,el,note,button,ceo,table,modal}=H();heading(root,'薪資管理','先核定工資與當月輸入，再預覽、覆核與關帳。');root.append(note('適用已確認的標準全職月薪、每日正常工時 8 小時制度。系統結算不代表款項已發放；待覆核項目未處理前不能關帳。',true));
    const employee=select('員工',ceo()?employees():[[H().getState().user.id,H().getState().user.name]]),month=field('薪資月份','month',ym(),true),result=el('div');
    const buttons=add(el('div','actions'),button('試算預覽',async ev=>run({action:'payrollPreview',employeeId:employee.input.value,month:month.input.value},ev.currentTarget,r=>result.replaceChildren(previewNode(r)))));

  const weekdays=labels.map(label=>field(label+' 時段（例：08:30-12:00,13:30-18:00；空白為不排班）','text'));
  const overrides=field('日期例外 JSON（例：{"2026-10-10":[]} 表示休息）','textarea','{}',true);
  overrides.input.rows=4;overrides.wrap.classList.add('wide');

  function latest(id){return (all()[id]||[]).filter(x=>x.confirmed===true).slice().sort((a,b)=>b.effectiveDate.localeCompare(a.effectiveDate))[0];}
  function fill(){const row=latest(person.input.value),schedule=row?.schedule||{weekdays:{},overrides:{}};weekdays.forEach((f,i)=>f.input.value=(schedule.weekdays?.[String(i)]||[]).map(pair=>pair.join('-')).join(','));overrides.input.value=JSON.stringify(schedule.overrides||{},null,2);confirm.input.checked=false;showHistory();}

function paginatedRows(title, rows, renderRows, initialSize = 50) {
  const records = Array.isArray(rows) ? rows.slice() : [];
  const host = el('section', 'history-section');
  const summary = el('p', 'muted history-page-summary'), output = el('div');
  summary.setAttribute('role', 'status');
  summary.setAttribute('aria-live', 'polite');
  const size = select(title + '每頁筆數', [['25', '25 筆'], ['50', '50 筆'], ['100', '100 筆']], String(initialSize));
  const jump = field(title + '頁碼', 'number', '1', true);
  jump.input.min = '1';
  let currentPage = 1, pageSize = [25, 50, 100].includes(initialSize) ? initialSize : 50;
  const first = button('第一頁', () => draw(1), 'secondary');
  const previous = button('上一頁', () => draw(currentPage - 1), 'secondary');
  const next = button('下一頁', () => draw(currentPage + 1), 'secondary');
  const last = button('最後一頁', () => draw(Math.max(1, Math.ceil(records.length / pageSize))), 'secondary');
  const controls = add(el('div', 'history-pagination'), first, previous, jump.wrap, next, last, size.wrap);
  controls.setAttribute('aria-label', title + '分頁控制');
  function draw(requestedPage) {
    const pages = Math.max(1, Math.ceil(records.length / pageSize));
    const value = Number(requestedPage);
    currentPage = Math.max(1, Math.min(pages, Number.isFinite(value) ? Math.floor(value) : 1));
    const start = (currentPage - 1) * pageSize, end = Math.min(start + pageSize, records.length);
    summary.textContent = '共 ' + records.length + ' 筆｜第 ' + (records.length ? start + 1 : 0) + '–' + end +
      ' 筆｜第 ' + currentPage + '／' + pages + ' 頁';
    jump.input.max = String(pages);
    jump.input.value = String(currentPage);
    first.disabled = previous.disabled = currentPage === 1;
    next.disabled = last.disabled = currentPage === pages;
    output.replaceChildren(renderRows(records.slice(start, end)));
  }
  size.input.addEventListener('change', () => { pageSize = Number(size.input.value); draw(1); });
  jump.input.addEventListener('change', () => draw(jump.input.value));
  add(host, summary, output, controls);
  draw(1);
  return host;
}

function productionRoster(raw) {
  const source = raw?.employees;
  if (!source || typeof source !== 'object' || Array.isArray(source)) return [];
  return Object.entries(source).map(([legacyId, person]) => {
    const record = {legacyId, name: person?.name, joinDate: person?.joinDate};
    // Preserve source lifecycle fields without copying salary, balances, credentials, or unrelated personnel data.
    for (const key of ['employmentStatus', 'terminationDate', 'active', 'status', 'isArchived',
      'archiveReason', 'archivedAt', 'employmentHistory']) {
      if (person && Object.prototype.hasOwnProperty.call(person, key)) {
        const value = person[key];
        record[key] = value && typeof value === 'object' ? JSON.parse(JSON.stringify(value)) : value;
      }
    }
    if (person && Object.prototype.hasOwnProperty.call(person, 'legacyContentId')) record.legacyContentId = person.legacyContentId;
    else if (person && Object.prototype.hasOwnProperty.call(person, 'id')) record.legacyContentId = person.id;
    return record;
  });
}

function legacyEmployment(person) {
  const value = String(person?.employmentStatus || '').toLowerCase();
  if (['archived', 'terminated', 'inactive', '離職', '已離職', '封存', '已封存'].includes(value) ||
      person?.active === false || person?.active === 0 || person?.isArchived === true) {
    return {archived: true, label: '已離職／封存'};
  }
  if (['active', 'employed', '在職'].includes(value) || person?.active === true || person?.active === 1) {
    return {archived: false, label: '在職'};
  }
  return {archived: false, label: value ? '原登記：' + person.employmentStatus : '任職狀態待確認'};
}

function registeredAccounts() {
  // Domain.view exposes real core.users as employees. Never manufacture a UID from an old ID or a name.
  return arr('employees').filter(person => typeof person.id === 'string' && person.id.length > 0);
}

function legacyBindDialog(person) {
  if (!ceo() || !person?.legacyId) return;
  if (person.approvedUid) { notify('此舊員工已有核准的帳號連結，請先查核現有關係。', true); return; }
  const linked = new Set(arr('legacyDirectory').map(row => row.approvedUid).filter(Boolean));
  const accounts = registeredAccounts().filter(account => !linked.has(account.id));
  if (!accounts.length) { notify('尚無可連結的已登記帳號。請先完成同仁報到或新增本人帳號。', true); return; }
  const user = select('已登記的登入帳號', [['', '— 請逐人核對後選擇 —'],
    ...accounts.map(account => [account.id, account.name + '｜' + (account.email || '未提供 Email') + '｜' + account.id])], '');
  user.input.required = true;
  const reason = field('核對依據與說明', 'textarea', '', true);
  const confirmed = field('我已獨立核對本人身分及舊紀錄歸屬', 'checkbox', '', true);
  const root = el('div');
  add(root, note('原系統員工：' + (person.name || '未命名') + '｜舊編號：' + person.legacyId +
    '。請核對登入 Email 與本人；姓名相同不代表同一人。', true));
  if (legacyEmployment(person).archived) root.append(note('此人在原名冊已離職／封存。歷史歸屬及登入資格由後端重新核對，不以此畫面自動恢復任職。', true));
  const dialog = modal('核對並連結原系統員工', root);
  root.append(form([user, reason, confirmed], '確認連結此帳號', async node => {
    if (!confirmed.input.checked || !reason.input.value.trim() || !user.input.value) {
      notify('請選擇登入帳號、填寫依據並勾選本人身分已核對。', true); return;
    }
    if (!accounts.some(account => account.id === user.input.value)) {
      notify('所選登入帳號不存在，請重新整理後再核對。', true); return;
    }
    if (await action({action: 'legacyBind', legacyId: person.legacyId, uid: user.input.value,
      identityConfirmed: true, reason: reason.input.value.trim()}, node)) dialog.close();
  }));
}

function archiveOrigin(batch) {
  const kind = String(batch?.kind || '').toLowerCase(), source = String(batch?.sourceSystem || '');
  if (source === 'homego-system' || ['migration', 'legacy', 'legacy-root', 'legacymigration', 'legacy-import'].includes(kind)) {
    return {key: 'legacy', label: '原系統歷史（唯讀）'};
  }
  if (kind === 'history' || source === 'homego-employee-prod') return {key: 'current', label: '工作台已封存紀錄'};
  return {key: 'unknown', label: '來源尚待確認'};
}

function provenanceGroups(batches) {
  const groups = ['legacy', 'current', 'unknown'].map(key => ({key, batches: 0, counts: {}, uncounted: 0}));
  for (const batch of batches) {
    const group = groups.find(row => row.key === archiveOrigin(batch).key);
    group.batches++;
    const counts = batch.historyCounts || batch.counts;
    if (!counts || typeof counts !== 'object') { group.uncounted++; continue; }
    for (const [key, value] of Object.entries(counts)) {
      if (typeof value === 'number' && Number.isFinite(value) && value >= 0) group.counts[key] = (group.counts[key] || 0) + value;
    }
  }
  return groups;
}

function archiveCountText(counts) {
  const labels = {employees: '原人員', attendance: '出勤', carRecords: '用車紀錄', corrections: '出勤補正',

  return Object.entries(counts || {}).filter(([, value]) => typeof value === 'number' && Number.isFinite(value) && value >= 0)
    .map(([key, value]) => (labels[key] || key) + ' ' + value + (key === 'employees' ? ' 位' : ' 筆')).join('、') || '筆數未提供';
}

function legacySyncCountText(counts) {
  const fields = [['attendance', '出勤'], ['requests', '申請'], ['logs', '工作日誌'], ['carRecords', '用車']];
  if (!counts || typeof counts !== 'object' || Array.isArray(counts)) return '筆數尚未回傳';
  let total = 0, complete = true;
  const parts = fields.map(([key, label]) => {
    const value = counts[key], valid = Number.isSafeInteger(value) && value >= 0;
    if (valid) total += value; else complete = false;
    return label + ' ' + (valid ? value + ' 筆' : '待確認');

  return (complete && Number.isSafeInteger(total) ? '合計 ' + total + ' 筆' : '合計待確認') + '｜' + parts.join('、');
}

async function resolveLoginName_(name){
  const alias=String(name||'').trim();if(alias.includes('@'))return alias;
  if(!/^[a-z0-9\u3400-\u9fff._-]{3,32}$/i.test(alias))throw Error('請輸入您設定的管理帳號或 Email。');
  const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),15000);
  try{
    const response=await fetch(config.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'resolveLoginAlias',input:{alias}}),redirect:'follow',signal:abort.signal});
    let result;try{result=await response.json();}catch{throw Error('帳號查詢服务暫時未回應，請稍後重試，或改用 Email 登入。');}
    if(!response.ok||!result.ok||!result.result?.email)throw Error('帳號或密碼不正確。尚未設定管理帳號時，請先使用原 Google 帳號確認本人。');
    return result.result.email;
  }catch(error){if(error.name==='AbortError')throw Error('帳號查詢逾時，請稍後重試，或改用 Email 登入。');throw error;}
  finally{clearTimeout(timeout);}
}

    const delay = number('班表時間後幾分鐘提醒', c.reminderDelayMinutes ?? 0, 0, 30), early = number('班表前可抵達分鐘', c.arrivalEarlyMinutes ?? 60, 0, 120), late = number('班表後可抵達分鐘', c.arrivalLateMinutes ?? 60, 0, 120);
    const reason = field('設定核對依據與原因', 'textarea', '', true);
    root.append(card('公司手機提醒與上班地點', note('預設均關閉。請先核對實際地址、座標與已核定班表，再由員工自行同意。班表、例外日與已核准請假均須正確。'), form([address, lat, lng, radius, accuracy, reminders, arrivals, delay, early, late, reason], '儲存公司輔助設定', async b => {
      let workplace = null;
      if (lat.input.value !== '' || lng.input.value !== '' || arrivals.input.checked) {
        if (!address.input.value.trim() || lat.input.value === '' || lng.input.value === '') { H().notify('請填寫並核對實際地址、緯度及經度。', true); return; }
        workplace = { address: address.input.value.trim(), lat: Number(lat.input.value), lng: Number(lng.input.value), radiusMeters: Number(radius.input.value), maxAccuracyMeters: Number(accuracy.input.value) };
      }
      await run({ action: 'assistSettings', workplace, remindersEnabled: reminders.input.checked, arrivalEnabled: arrivals.input.checked, reminderDelayMinutes: Number(delay.input.value), arrivalEarlyMinutes: Number(early.input.value), arrivalLateMinutes: Number(late.input.value), reason: reason.input.value.trim() }, b);
    }), note('這些提示不自動判定曠職、不自動下班，也不直接產生薪資扣款。手機推播仍需完成後端 FCM 與排程部署；儲存開關不代表已完成實機測試。')));
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') clearSensitive(); });
  window.addEventListener('pagehide', clearSensitive);
  return { panel, settingsPanel, pendingCard, cancelArrival, clearSensitive };
})();

<script>
/* UI owns only a draft. Identity, opening amounts and confirmation are server verified. */
window.HGReconciliation=(function(){
  const SCHEMA='hg-annual-opening-draft-v1',KEYS=['employeeId','startDate','endDate','asOf','grantedMinutes','usedMinutes','settledMinutes','source','evidence'];
  function panel(){
    const H=window.HG,{card,note,table,el,add,field,select,form,button}=H;
    const records=H.arr('reconciliations'),box=card('特休期初對帳',note('舊年度累計數不能當作本期餘額。核對原期別、切換日前已用與已結清後，僅將剩餘分鐘開為一般特休；遞延與原年度工資須另走協議及薪資流程。',true));
    box.append(table(['員工／期別','切換日','應給／已用／已結清（分）','期初剩餘','核定／來源'],records.map(r=>[H.emp(r.employeeId)+' · '+r.startDate+'～'+r.endDate,r.asOf,[r.grantedMinutes,r.usedMinutes,r.settledMinutes].join(' / '),r.remainingMinutes+' 分',add(el('div'),el('div','',H.date(r.confirmedAt)),el('div','',r.source),button('查看核對紀錄',()=>H.modal('期初核對紀錄',el('pre','json-output',JSON.stringify(r,null,2))),'secondary'))])));
    if(!H.ceo())return box;
    const fields={employeeId:select('員工 UID／姓名',H.arr('employees').filter(e=>e.active!==false).map(e=>[e.id,e.name+' · '+e.id])),startDate:field('原期別起日','date','',true),endDate:field('原期別迄日','date','',true),asOf:field('切換日（當日零時起新制）','date',H.today(),true),grantedMinutes:field('本期應給分鐘（不含遞延）','number','',true),usedMinutes:field('切換日前本期已用分鐘','number','',true),settledMinutes:field('切換日前本期已結清分鐘','number','',true),source:field('來源檔名／批次／單號','text','',true),evidence:field('UID 對應、期別及缺漏／跨期核對依據','textarea','',true)};
    ['grantedMinutes','usedMinutes','settledMinutes'].forEach(k=>{fields[k].input.min='0';fields[k].input.step='1';});
    fields.asOf.input.max=H.today();
    let preview=null,sourceDocument=null;
    const previewBox=el('div'),sourceBox=el('div'),checked=field('已核對 UID、原期別及切換前後紀錄，確認以上來源足以支持期初入帳','checkbox'),commit=button('確認期初入帳',async ev=>{
      if(!preview||!checked.input.checked){H.notify('請先預覽並勾選覆核確認。',true);return;}
      const b=ev.currentTarget;b.disabled=true;
      try{const j=await H.api('action',Object.assign(read(),{action:'reconciliationCommit',previewHash:preview.previewHash,confirmed:true,confirmation:'OPENING_REVIEWED'}));await H.reload();H.notify('期初對帳已核定並回讀；核定編號 '+j.result.id+'。');}
      catch(e){H.notify(e.message,true);invalidate();}finally{b.disabled=!preview;}
    });commit.disabled=true;
    function read(){const x={};KEYS.forEach(k=>{const raw=fields[k].input.value;x[k]=['grantedMinutes','usedMinutes','settledMinutes'].includes(k)?(raw.trim()===''?null:Number(raw)):raw.trim();});return x;}
    function invalidate(){preview=null;checked.input.checked=false;commit.disabled=true;previewBox.replaceChildren();}
    Object.values(fields).forEach(f=>{f.input.addEventListener('input',invalidate);f.input.addEventListener('change',invalidate);});
    const draftForm=form(KEYS.map(k=>fields[k]),'產生伺服器核對預覽',async b=>{
      b.disabled=true;invalidate();
      try{const j=await H.api('action',Object.assign(read(),{action:'reconciliationPreview'}));preview=j.result;const p=preview;
        previewBox.replaceChildren(table(['核對項目','結果'],[['員工 UID',p.input.employeeId],['到職日',p.joinDate],['原期別',p.input.startDate+'～'+p.input.endDate],['應給 − 已用 − 已結清',[p.input.grantedMinutes,p.input.usedMinutes,p.input.settledMinutes].join(' − ')],['將新增可用分鐘',p.remainingMinutes],['新額度有效期',p.bucketStartDate+'～'+p.bucketEndDate],['年資門檻参考',p.referenceAnnualDays+' 天'],['資料版本',p.baseRevision]]),note(p.referenceNotice,true),note(p.cutoverMeaning));commit.disabled=false;
      }catch(e){H.notify(e.message,true);}finally{b.disabled=false;}
    });
    const file=field('載入舊對帳來源／草稿 JSON（最多 1 MB）','file');file.input.accept='.json,application/json';
    file.input.addEventListener('change',async()=>{
      invalidate();sourceDocument=null;sourceBox.replaceChildren();const f=file.input.files?.[0];if(!f)return;
      try{if(f.size>1048576)throw Error('檔案超過 1 MB。');const x=JSON.parse(await f.text());if(!x||typeof x!=='object'||Array.isArray(x))throw Error('JSON 格式不正確。');
        if(x.schema===SCHEMA){if(!x.input||KEYS.some(k=>!Object.prototype.hasOwnProperty.call(x.input,k)))throw Error('期初草稿欄位不足。');if(!H.arr('employees').some(e=>e.id===x.input.employeeId&&e.active!==false))throw Error('草稿 UID 不在目前有效員工名冊。');KEYS.forEach(k=>{if(!['string','number'].includes(typeof x.input[k]))throw Error('草稿欄位型別錯誤。');fields[k].input.value=String(x.input[k]);});sourceDocument=x.sourceDocument||null;}
        else if(['homego-leave-reconciliation-v1','homego-leave-reconciliation-draft-v1'].includes(x.schema)){sourceDocument=x;fields.source.input.value=f.name;}
        else throw Error('不支援此來源 schema。');
        sourceBox.append(note('來源僅供人工核對；姓名不會自動對應 UID，舊累計、調整及遞延不會自動轉入本期。草稿重新載入後仍須重新預覽。',true),el('pre','json-output',JSON.stringify(sourceDocument||x,null,2)));
      }catch(e){H.notify('來源未載入：'+e.message,true);}
    });
    const download=button('下載待核定對帳草稿',()=>{
      const draft={schema:SCHEMA,status:'待核定草稿',exportedAt:new Date().toISOString(),input:read(),sourceDocument:sourceDocument};const content=JSON.stringify(draft,null,2);if(new Blob([content]).size>1048576){H.notify('草稿超過 1 MB，請改於依據欄引用外部來源檔。',true);return;}
      const url=URL.createObjectURL(new Blob([content],{type:'application/json;charset=utf-8'})),a=el('a');a.href=url;a.download='特休期初待核定草稿_'+H.today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    },'secondary');
    box.append(note('以分钟填寫；空白不是零。切換日以前已關帳月份不變更，切換日起若已關帳會阻擋；已有重疊特休桶或現行核准單時也會阻擋，不能清空舊資料後硬匯。'),file.wrap,sourceBox,draftForm,download,previewBox,checked.wrap,commit);
    return box;
  }
  return {panel};
})();
